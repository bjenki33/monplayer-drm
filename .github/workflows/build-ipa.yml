name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          sudo xcode-select -s /Applications/Xcode.app
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | head -30

      - name: Build (unsigned)
        run: xcodebuild -project "$GITHUB_WORKSPACE/MonPlayerDRM/MonPlayerDRM.xcodeproj" -target MonPlayerDRM -configuration Release -sdk iphoneos -derivedDataPath "$GITHUB_WORKSPACE/build" CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MonPlayerDRM.app"
          ls -la "$APP_PATH"
          rm -rf Payload MonPlayerDRM-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry MonPlayerDRM-unsigned.ipa Payload
          ls -la MonPlayerDRM-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MonPlayerDRM-unsigned
          path: MonPlayerDRM-unsigned.ipa
          if-no-files-found: error
